<title>DMXI Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root {
  --ink:#141923;--muted:#5F6B84;--rule:#DFE4EC;
  --ground:#F2F5F9;--surface:#FFFFFF;--accent:#0ABFAD;
  font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#E2E7F0;--muted:#7B8BA8;--rule:#222C3E;--ground:#0D1220;--surface:#151E2E;}
}
:root[data-theme="dark"]{--ink:#E2E7F0;--muted:#7B8BA8;--rule:#222C3E;--ground:#0D1220;--surface:#151E2E;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
nav{background:var(--surface);border-bottom:1px solid var(--rule);padding:0 max(24px,5vw);height:52px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--ink);text-decoration:none;}
.nav-logo em{font-style:normal;color:var(--accent);}
.wrap{max-width:900px;margin-inline:auto;padding:32px max(24px,5vw);flex:1;display:flex;flex-direction:column;gap:16px;}
.doc-card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;}
.doc-header{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.doc-title{font-weight:600;font-size:15px;margin:0;}
.doc-meta{font-size:12px;color:var(--muted);}
.doc-preview{width:100%;min-height:520px;border:none;display:block;}
.pdf-embed{width:100%;height:70vh;border:none;}
.img-wrap{padding:20px;text-align:center;}
.img-wrap img{max-width:100%;border-radius:6px;box-shadow:0 2px 16px rgba(0,0,0,0.12);}
.err{padding:60px 24px;text-align:center;color:var(--muted);}
.err h2{color:var(--ink);font-family:'Fraunces',serif;font-size:22px;margin-bottom:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
footer{border-top:1px solid var(--rule);padding:20px max(24px,5vw);font-size:12px;color:var(--muted);text-align:center;}
footer a{color:var(--accent);text-decoration:none;}
</style>

<nav>
  <a href="/" class="nav-logo">DM<em>XI</em></a>
</nav>

<div class="wrap" id="root">
  <div class="err"><h2>Redirecting…</h2><p>Please wait.</p></div>
</div>

<footer>
  Shared via <a href="https://dmxiaccounting.com">DMXI Accounting</a>
</footer>

<script>
// Redirect to the app subdomain where same-origin API calls work
location.replace('https://app.dmxiaccounting.com/doc.html' + location.search);
</script>
<script>
const API = 'https://app.dmxiaccounting.com/api';

function sizeLabel(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

async function load() {
  const token = new URLSearchParams(location.search).get('t');
  const root = document.getElementById('root');
  if (!token) { root.innerHTML = '<div class="err"><h2>Invalid link</h2><p>No document token in this URL.</p></div>'; return; }

  const fileUrl = `${API}/public/attachments/${token}`;

  // Probe with a HEAD-like fetch to get metadata
  let resp;
  try {
    resp = await fetch(fileUrl);
    if (!resp.ok) throw new Error((await resp.json().catch(()=>({error:'Not found'}))).error);
  } catch(e) {
    root.innerHTML = `<div class="err"><h2>Document not available</h2><p>${e.message}</p></div>`;
    return;
  }

  const mime = resp.headers.get('content-type') || '';
  const disp = resp.headers.get('content-disposition') || '';
  const nameMatch = disp.match(/filename="?([^"]+)"?/);
  const filename = nameMatch ? nameMatch[1] : 'document';

  const isImage = mime.startsWith('image/');
  const isPdf   = mime === 'application/pdf';

  let preview = '';
  if (isImage) {
    preview = `<div class="img-wrap"><img src="${fileUrl}" alt="${filename}" /></div>`;
  } else if (isPdf) {
    preview = `<embed class="pdf-embed" src="${fileUrl}" type="application/pdf" />`;
  } else {
    preview = `<div style="padding:40px 24px;text-align:center;color:var(--muted);">
      <div style="font-size:48px;margin-bottom:16px;">📄</div>
      <div style="font-weight:600;font-size:15px;color:var(--ink);margin-bottom:8px;">${filename}</div>
      <div style="font-size:13px;margin-bottom:20px;">This file type cannot be previewed in the browser.</div>
      <a href="${fileUrl}" class="btn btn-accent" download="${filename}">Download file</a>
    </div>`;
  }

  root.innerHTML = `
    <div class="doc-card">
      <div class="doc-header">
        <div>
          <div class="doc-title">${filename}</div>
          <div class="doc-meta">${mime}</div>
        </div>
        <a href="${fileUrl}" class="btn" download="${filename}">↓ Download</a>
      </div>
      ${preview}
    </div>
  `;
}

load();
</script>
